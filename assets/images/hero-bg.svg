<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- Background sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3329;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#2C4A3E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a6150;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C4A3E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e3329;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d6b55;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2C4A3E;stop-opacity:1"/>
    </linearGradient>
    <!-- Subtle texture overlay -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Sky base -->
  <rect width="1200" height="700" fill="url(#skyGrad)"/>
  
  <!-- Distant hills / countryside silhouette -->
  <path d="M0,320 C80,290 160,280 240,300 C320,320 380,310 460,285 C540,260 610,270 700,290 C790,310 860,295 950,275 C1040,255 1110,270 1200,285 L1200,700 L0,700 Z" fill="#1a2e24" opacity="0.7"/>
  
  <!-- Middle ground rolling fields -->
  <path d="M0,400 C100,380 200,390 300,370 C400,350 500,360 600,380 C700,400 800,385 900,370 C1000,355 1100,370 1200,365 L1200,700 L0,700 Z" fill="url(#fieldGrad)"/>
  
  <!-- Foreground ground -->
  <path d="M0,480 C150,460 300,470 450,455 C600,440 750,460 900,450 C1050,440 1150,455 1200,450 L1200,700 L0,700 Z" fill="#213d30"/>
  
  <!-- Fence posts (left side) -->
  <g stroke="#8BAD9A" stroke-width="2" opacity="0.4">
    <line x1="50" y1="440" x2="50" y2="510"/>
    <line x1="120" y1="435" x2="120" y2="505"/>
    <line x1="190" y1="430" x2="190" y2="500"/>
    <line x1="260" y1="432" x2="260" y2="502"/>
    <!-- Horizontal rail -->
    <path d="M50,465 C100,462 160,459 260,460" fill="none"/>
    <path d="M50,490 C100,487 160,484 260,485" fill="none"/>
  </g>
  
